<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="quiz-container">
    <section class="quiz-header">
      <div>
        <h1>Quick Quiz Challenge</h1>
        <p class="quiz-description">Answer questions from any topic. The quiz is open-ended and recommends the stream that best matches your strengths.</p>
        <p class="question" id="questionText">Loading question...</p>
      </div>
      <div class="status">
        <span id="questionCounter">Question 1 / 5</span>
        <span id="categoryLabel">Stream: General</span>
        <span id="scoreDisplay">Score: 0</span>
      </div>
    </section>

    <div class="options" id="optionsContainer"></div>

    <div class="controls">
      <button class="btn secondary" id="prevBtn" type="button">Previous</button>
      <button class="btn primary" id="nextBtn" type="button">Next</button>
      <button class="btn secondary" id="restartBtn" type="button">Restart</button>
    </div>

    <div class="result-card" id="resultCard">
      <h2>Quiz Complete!</h2>
      <p id="resultText"></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
