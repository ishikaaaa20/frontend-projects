<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Color Guessing Game</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="display-container">
            <p>Color Guessing Game</p>
            <div class="timer"></div>
            <div class="score">Score: <span id="current-score">0</span></div>
            <hr>
            <div id="container">
                <div class="number-of-count">
                    <span class="number-of-questions"></span>
                </div>
            </div>
            <button id="next-button" class="hide" type="button">Next</button>
            <div class="score-container hide">
                <div id="user-score"></div>
                <p class="final-para hide">Thank you for playing! Your score is:</p>
                <button id="restart" type="button">Restart</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body> 
</html>
